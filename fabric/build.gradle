// AuraLite-Render fabric glue: window swapchain, frame pacing, pack
// hot-reload, RenderDoc-friendly labelling (ROADMAP Phase 4).
//
// IMPORTANT - what this file is and is not:
//  * It is the ONLY build lane that needs a JDK 21 (the host build stays
//    Java 11 and prints "fabric: SKIP" on purpose).
//  * Nothing here is claimed green until `./gradlew build` runs on a JDK 21
//    lane AND a windowed frame has been presented on a real GPU
//    (ROADMAP Phase 4 + 5 gates). Standing rule 4 applies.
plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = 'auralite-render-fabric' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// The COMPILE version is the game's (3.3.3 for 1.21.1), and the classpath is
// the game's jars DIRECTLY - no "stripped" copies.
//
// Both halves of that sentence are r61 lessons, paid for on a real client:
//  * compiling against 3.4.3 produced a jar that called
//    MemoryUtil.memFree(ByteBuffer), which 3.3.3 does not have, and the game
//    died with NoSuchMethodError on the first frame. The jar must be built
//    against the ABI it will run on;
//  * the stripped copies were a second, silent copy of the same mistake: a Zip
//    task with undeclared inputs is never UP-TO-DATE and can be reused stale, so
//    the classpath still held 3.4.3 after third_party/ changed. 3.3.3's
//    multi-release entries are Java 8/11 classes (that is what "compiled for
//    8" means for a multi-release jar), so the reason the stripping existed is
//    gone with the version bump - and with it the way the build could lie.
//
// The Vulkan module is the paired 3.3.3 jar: the game ships none at all (vanilla
// is GL-only), so those classes ride into the jar below.
def lwjglJars = [
        file('../third_party/lwjgl.jar'),
        file('../third_party/lwjgl-opengl.jar'),
        file('../third_party/lwjgl-vulkan-3.3.3.jar'),
]

// The game ships LWJGL 3.3.3 without the Vulkan module (vanilla is GL-only),
// so `new VkDevice()` dies with NoClassDefFoundError on
// org/lwjgl/vulkan/VkDebugUtilsMessengerCallbackEXTI unless the classes ride
// along. Shade the vulkan module INTO THE GAME'S VERSION (3.3.3), not the
// compile-time 3.4.3: a 3.4.3 vulkan class reaches org/lwjgl/system/
// Callback$Descriptor, which does not exist in the game's 3.3.3 core (first
// r31 crash). The module has no native side of its own (it calls the system
// vulkan-1.dll through the game's lwjgl.dll), so classes alone are the
// integration; META-INF (multi-release module-info) is excluded.
jar {
    from({ zipTree('../third_party/lwjgl-vulkan-3.3.3.jar') }) {
        exclude 'META-INF/**'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile the renderer itself from this repository's own sources - no
    // published artifacts, no Gradle in the host lane. LWJGL is compile-time
    // only here; the game provides it at runtime (see gradle.properties).
    // Stripped copies: see the multi-release note above.
    compileOnly files(lwjglJars)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

compileJava {
    // The core/backends stay Java 11 source-compatible; this module is the
    // one documented exception and may use Java 21.
    options.release = 21
    options.compilerArgs += ['-Xlint:-options']
    source fileTree('../core/src/main/java')
    source fileTree('../backend-gl/src/main/java')
    source fileTree('../backend-vulkan/src/main/java')
    source fileTree('../backend-null/src/main/java')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
