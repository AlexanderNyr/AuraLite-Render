# Fabric Loom / Gradle settings for the AuraLite-Render glue module.
org.gradle.jvmargs=-Xmx1200m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=1

# The game runs this module; the host build never compiles it.
# Set to the Minecraft + yarn (or mojmap) versions of the lane you build on.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
fabric_version=0.116.17+1.21.1

# Matches the host build's compile-verified LWJGL line.
# At runtime the game supplies LWJGL on its classpath - the backends only use
# GL46C/VK13 entry points that exist in the game's LWJGL too; re-verify the
# minor version on the lane where this builds.
lwjgl_version=3.4.3

mod_version=0.1.0
maven_group=dev.auralite
